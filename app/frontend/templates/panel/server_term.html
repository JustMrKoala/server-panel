{% extends ../base.html %}

{% block meta %}
{% end %}

{% block title %}{{ panel_name }} - {{ translate('serverDetails', 'serverDetails', data['lang']) }}{% end %}

{% block content %}

<div class="content-wrapper">

  {% include "parts/server_header.html" %}

  <div class="srv-panel srv-console">
    <div class="srv-console-screen">
      <div id="virt_console"></div>
      <button id="to-bottom" class="btn btn-sm btn-light srv-console-jump" hidden>
        <i class="ph ph-arrow-down"></i> {{ translate('serverDetails', 'reset', data['lang']) }}
      </button>
    </div>
    <div class="srv-console-input server_command">
      <span class="srv-console-prompt">&gt;</span>
      <input type="text" class="form-control server_command" id="server_command" name="server_command"
        placeholder="{{ translate('serverTerm', 'commandInput', data['lang']) }}" autocomplete="off">
      <button id="submit" class="btn btn-primary" type="button">{{ translate('serverTerm', 'sendCommand', data['lang']) }}</button>
    </div>
  </div>
</div>
<link rel="stylesheet" href="/static/assets/css/partial/crafty-terminal.css">
<!-- content-wrapper ends -->

{% end %}

{% block js %}
<script>

  const serverId = new URLSearchParams(document.location.search).get('id')

  async function get_server_log() {
    const token = getCookie("_xsrf")
    let colors = true;
    let res = await fetch(`/api/v2/servers/${serverId}/logs?colors=${colors}`, {
      method: 'GET',
      headers: {
        'X-XSRFToken': token
      },
    });
    let responseData = await res.json();
    let html = ``
    if (responseData.status === "ok") {
      for (let value of responseData.data) {
        html += `<span class='box'>${value}<br /></span>`
      }
      console.log('Got Log From Server')
      $('#virt_console').html(html);
      scrollConsole();
    } else {

      bootbox.alert({
        title: responseData.error,
        message: responseData.error_data
      });
    }
  }



  function new_line_handler(data) {
    $('#virt_console').append(data.line)
    const elem = document.getElementById('virt_console');
    try {
      if (!scrolled) {
        scrollConsole();
      }
    } catch {
      scrollConsole();
    }
  }

  //used to get cookies from browser - this is part of tornados xsrf protection - it's for extra security
  function getCookie(name) {
    let r = document.cookie.match("\\b" + name + "=([^;]*)\\b");
    return r ? r[1] : undefined;
  }

  $(document).ready(function () {
    console.log("ready!");
    get_server_log()
    // Focus the command box without scrolling the page down to it
    document.getElementById('server_command').focus({ preventScroll: true });

    webSocket.on('vterm_new_line', new_line_handler)
  });

  $('#server_command').on('keydown', function (e) {
    if (e.which == 13) {
      $(this).attr("disabled", "disabled"); //Disable textbox to prevent multiple submit
      sendConsoleCommand()
      $(this).removeAttr("disabled"); //Enable the textbox again if needed.
      $(this).focus();
    }
    else if (e.which == 38) {
      e.preventDefault();
      $('#server_command').val(cmdHistory.getPrev());
    } else if (e.which == 40) {
      e.preventDefault();
      $('#server_command').val(cmdHistory.getNext());
    }

  });

  $("#submit").click(function (e) {
    e.preventDefault();
    sendConsoleCommand();

  });

  function scrollConsole() {
    let logview = $('#virt_console');
    if (logview.length)
      logview.scrollTop(logview[0].scrollHeight - logview.height());
  }


  async function sendConsoleCommand() {
    let serverCommand = $("#server_command").val()
    console.log(serverCommand)

    cmdHistory.push(serverCommand);

    let token = getCookie("_xsrf")

    let formdata = new FormData();

    formdata.append('command', serverCommand)

    console.log('sending command: ' + serverCommand)
    let res = await fetch(`/api/v2/servers/${serverId}/stdin`, {
      method: 'POST',
      headers: {
        'X-XSRFToken': token
      },
      body: serverCommand,
    });

    let responseData = await res.text();
    console.log("got response:");
    console.log(responseData);
    $("#server_command").val('')
  }


  const cmdHistory = {
    history: [],
    current: 0,
    push: function (cmd) {
      this.history.push(cmd);
      this.current = this.history.length - 1;
    },
    getPrev: function () {
      const prevCommand = this.history[this.current];
      this.current--;
      if (this.current < 0) this.current = 0;
      return prevCommand;
    },
    getNext: function () {
      this.current++;
      if (this.current > (this.history.length - 1)) {
        this.current = (this.history.length - 1);
        return '';
      }
      const nextCommand = this.history[this.current];
      return nextCommand;
    }
  }

  const chkScroll = (e) => {
    const elem = $(e.currentTarget);
    if (Math.round(elem[0].scrollHeight - elem.scrollTop()) <= elem.outerHeight()) {
      document.getElementById("to-bottom").style.visibility = "hidden";
      document.getElementById("to-bottom").hidden = true;
      scrolled = false;
    } else {
      document.getElementById("to-bottom").style.visibility = "visible";
      document.getElementById("to-bottom").hidden = false;
      scrolled = true;
    }
  }

  const scrollToBottom = (id) => {
    const element = $(`#virt_console`);
    element.animate({
      scrollTop: element.prop("scrollHeight")
    }, 500);
  }

  $(document).ready(() => {
    $('#virt_console').on('scroll', chkScroll);
    $('#to-bottom').on('click', scrollToBottom);
    document.addEventListener('visibilitychange', (event) => {
      console.log('Tab has resumed from hibernation.');
      get_server_log();
    });

  });
</script>

{% end %}
